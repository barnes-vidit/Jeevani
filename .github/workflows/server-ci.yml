name: Backend CI

on:
  push:
    branches: [ master ]
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'

jobs:
  server-ci:
    name: Backend (Express) CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Check Server Entrypoint Syntax
        run: node --check index.js
